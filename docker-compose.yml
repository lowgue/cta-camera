###############################################
# Docker Compose — Frigate NVR
# Sistema de Vigia do Laboratório (CTA)
###############################################

services:
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:stable
    restart: unless-stopped

    # Acesso privilegiado ao hardware (câmera, GPU)
    privileged: true

    # Acesso aos dispositivos de vídeo e tmpfs para
    # cache de detecção (evita desgaste do SD card)
    shm_size: "256mb"
    tmpfs:
      - /tmp/cache:rw,exec,size=256m

    volumes:
      # Configuração do Frigate
      - ./config/frigate.yml:/config/config.yml:ro
      # Diretório de gravações (persistente)
      - ./storage/recordings:/media/frigate/recordings
      # Diretório de snapshots (persistente)
      - ./storage/snapshots:/media/frigate/clips

    ports:
      # Interface web do Frigate
      - "5000:5000"
      # Porta RTSP interna do Frigate (para re-stream)
      - "8971:8971"

    environment:
      # Timezone do Brasil
      - TZ=America/Sao_Paulo

    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Healthcheck para auto-restart se travar
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  deepstack:
    container_name: deepstack
    # Imagem específica para processadores ARM64 (Raspberry Pi 4/5)
    image: deepquestai/deepstack:arm64-cpu
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      - VISION-FACE=True
      # - TZ=America/Sao_Paulo

  double-take:
    container_name: double-take
    image: jakowenko/double-take
    restart: unless-stopped
    volumes:
      - ./config/double-take.yml:/double-take/.double-take/config.yml:ro
      - ./storage/double-take:/.storage
    ports:
      - "3000:3000"
    depends_on:
      - frigate
      - mosquitto
      - deepstack
