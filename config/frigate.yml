###############################################
# Frigate NVR — Configuração
# Sistema de Vigia do Laboratório (CTA)
#
# Documentação oficial:
# https://docs.frigate.video/configuration/
###############################################

# ── MQTT (opcional) ──────────────────────────
# Frigate usa MQTT para enviar eventos. Se não
# precisar de integração com Home Assistant ou
# alertas externos, pode desabilitar.
mqtt:
  enabled: false
  # Se quiser ativar futuramente:
  # host: localhost
  # port: 1883
  # user: frigate
  # password: TROCAR_SENHA_FORTE

# ── Detector ─────────────────────────────────
# No Raspberry Pi sem Coral TPU, usamos o
# detector de CPU. É mais lento (~5-10 FPS de
# inferência), mas suficiente para um stream.
#
# Se adquirir um Google Coral USB Accelerator,
# troque para "edgetpu" para ~100+ FPS.
detectors:
  cpu:
    type: cpu
    num_threads: 3
  # Se tiver Google Coral USB:
  # coral:
  #   type: edgetpu
  #   device: usb

# ── Câmeras ──────────────────────────────────
cameras:
  lab:
    # Conecta ao stream RTSP local do MediaMTX
    ffmpeg:
      inputs:
        - path: rtsp://usuario:TROCAR_SENHA_FORTE@localhost:8554/lab
          roles:
            - detect
            - record

      # Configurações de decodificação otimizadas para Pi
      output_args:
        detect: -f rawvideo -pix_fmt yuv420p
        record: -f segment -segment_time 60 -segment_format mp4 -reset_timestamps 1 -strftime 1 -c copy

    # Resolução para detecção (menor = mais rápido)
    # O Frigate redimensiona internamente para o detector
    detect:
      width: 1280
      height: 720
      fps: 5

    # ── Gravação ─────────────────────────────
    # Grava SOMENTE quando detecta movimento/objeto
    record:
      enabled: true
      retain:
        days: 7          # mantém gravações por 7 dias
        mode: motion     # grava apenas quando há movimento
      events:
        retain:
          default: 14    # eventos (pessoa detectada) ficam 14 dias
          mode: active_objects

    # ── Snapshots ────────────────────────────
    # Salva uma foto de cada evento detectado
    snapshots:
      enabled: true
      retain:
        default: 14      # snapshots ficam 14 dias

    # ── Objetos a detectar ───────────────────
    objects:
      track:
        - person         # detecta apenas pessoas
      filters:
        person:
          min_score: 0.5       # confiança mínima para considerar
          threshold: 0.7       # confiança para confirmar detecção
          min_area: 5000       # área mínima em pixels (evita falsos)

    # ── Zonas (opcional) ─────────────────────
    # Defina zonas específicas dentro do campo de
    # visão para monitoramento mais preciso.
    # Descomente e ajuste as coordenadas após ver
    # o stream na interface do Frigate.
    # zones:
    #   entrada:
    #     coordinates: 0.0,0.0,0.3,0.0,0.3,1.0,0.0,1.0
    #   bancada:
    #     coordinates: 0.3,0.0,1.0,0.0,1.0,1.0,0.3,1.0

# ── Interface Web ────────────────────────────
# O Frigate disponibiliza uma interface web na
# porta 5000 (configurada no docker-compose.yml)
# onde é possível ver o live, eventos, e snapshots.
